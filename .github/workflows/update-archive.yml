name: Update Totoloto Archive

on:
  schedule:
    # Runs Thu and Sun at 01:00 UTC (02:00 Portugal time) — day after each draw
    - cron: '0 1 * * 4,0'
  workflow_dispatch: # allow manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest draw
        run: node .github/scripts/update-archive.mjs

      - name: Commit if archive changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/totoloto_archive.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: add latest Totoloto draw [skip ci]"
            git push
          fi
